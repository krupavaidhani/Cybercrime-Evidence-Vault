<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVault Initializing...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            /* Slate-950 */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
            /* Allow dragging */
            border-radius: 12px;
            /* Rounded corners for frameless window */
            border: 1px solid #1e293b;
            /* Subtle border */
        }

        .container {
            text-align: center;
            width: 80%;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4));
            /* Emerald glow */
            animation: pulse 3s infinite ease-in-out;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 4px;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: #f1f5f9;
            /* Slate-100 */
        }

        .subtitle {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #64748b;
            /* Slate-500 */
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background-color: #1e293b;
            /* Slate-800 */
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: #10b981;
            /* Emerald-500 */
            width: 0%;
            animation: load 2.5s ease-in-out forwards;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
        }

        .status-text {
            margin-top: 10px;
            font-size: 10px;
            color: #475569;
            /* Slate-600 */
            font-family: 'Courier New', Courier, monospace;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4));
            }

            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.6));
            }

            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4));
            }
        }

        @keyframes load {
            0% {
                width: 0%;
            }

            40% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="assets/icon.png" alt="CyberVault Logo" class="logo">
        <h1>CYBERVAULT</h1>
        <p class="subtitle">Secure Blockchain Ledger v1.0</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <p class="status-text">SYSTEM INITIALIZING...</p>
    </div>
</body>

</html>
